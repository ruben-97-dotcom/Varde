<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varde Portal</title>
<link rel="icon" href="assets/varde-ikon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/varde.css">
<script src="js/tema.js"></script>
<meta name="theme-color" content="#E8EEE2">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Portal: samme designsystem som appen, bredere arbeidsflate for PC */
.p-shell { position: relative; max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
.p-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px dashed var(--line); }
.p-top-in { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 68px; }
.p-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; font-size: 20px; text-decoration: none; color: var(--ink); }
.p-brand .mark { width: 36px; height: 36px; }
.p-brand span { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.p-app { display: inline-flex; align-items: center; color: var(--ink); text-decoration: none; white-space: nowrap; }
#logout { white-space: nowrap; }
@media (max-width: 640px) { .p-app, .p-user small { display: none; } }
.p-user { display: flex; align-items: center; gap: 10px; min-width: 0; }
.p-user small { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding: 30px 2px 18px; }
.p-head h1 { font-size: 42px; line-height: 1; letter-spacing: -0.04em; }
.p-head .kicker { margin-bottom: 8px; }
.contours { top: -68px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 38px; padding: 0 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--dark); color: var(--on-dark); }
:root.dark .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.banner { display: flex; gap: 10px; align-items: start; background: var(--amber-tint); color: var(--ink-2); border-radius: var(--r-lg); padding: 12px 16px; font-size: 14.5px; margin-bottom: 12px; }
.banner b { color: var(--amber); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 4px; }
.kpi span { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi b { font-size: 36px; font-weight: 900; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kpi small { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 10px; margin-top: 10px; }
.panel h2 { font-size: 19px; }
.panel .p-sub { color: var(--muted); font-size: 13.5px; margin-top: -4px; }
.insight { display: grid; gap: 10px; }
.insight ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: i; color: var(--ink-2); }
.insight li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.insight li::before { counter-increment: i; content: counter(i, decimal-leading-zero); font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); padding-top: 3px; }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 3rem; align-items: center; gap: 12px; font-size: 14.5px; }
.hbar .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 12px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.hbar.skjult .val { color: var(--muted); font-weight: 500; }
@media (max-width: 460px) { .hbar { grid-template-columns: minmax(0, 8rem) 1fr 2.6rem; gap: 8px; } }
.weekchart { position: relative; }
.weekchart svg { display: block; width: 100%; height: 220px; overflow: visible; }
.weekchart .grid line { stroke: var(--line); stroke-dasharray: 2 4; }
.weekchart .axis text { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
.weekchart rect.stub { fill: var(--line-2); }
.weekchart .barfill { fill: var(--bar); }
.tip { position: absolute; pointer-events: none; background: var(--dark); color: var(--on-dark); font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
.empty { color: var(--muted); font-size: 14px; }
.tbl-wrap { overflow-x: auto; margin: 0 -16px -16px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 11px 16px; border-top: 1px dashed var(--line); white-space: nowrap; }
th { font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { font-weight: 800; }
td.muted { color: var(--muted); }
.users-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--line); }
.users-row:first-child { border-top: 0; }
.users-row b { font-weight: 800; display: block; }
.users-row small { color: var(--muted); word-break: break-all; }
@media (max-width: 560px) { .users-row { grid-template-columns: 1fr; } }
.role { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); }
.users-row.off { opacity: .5; }
.addform { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
@media (max-width: 820px) { .addform { grid-template-columns: 1fr; } }
.ok { background: var(--green-tint); border-radius: var(--r-lg); padding: 12px 16px; font-size: 14.5px; }
.ok code { font-family: var(--mono); font-weight: 700; user-select: all; }
.login { max-width: 420px; margin: 0 auto; padding-top: 40px; display: grid; gap: 14px; }
.tabs-p { display: flex; gap: 6px; margin: -4px 0 16px; overflow-x: auto; padding-bottom: 2px; }
.tabs-p button { min-height: 44px; border: 1.5px solid var(--ink); background: transparent; border-radius: var(--r-sm); padding: 0 14px; font-weight: 700; font-size: 14px; color: var(--ink); white-space: nowrap; }
.tabs-p button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #1D261D; }
.kfs { border: 0; padding: 14px 0 0; margin: 0; border-top: 1px dashed var(--line); }
.kfs legend { font-weight: 800; padding: 0; margin-bottom: 8px; float: left; width: 100%; }
.kgrid { clear: both; display: grid; grid-template-columns: 1fr 12rem; gap: 10px; }
.kwide { grid-column: 1 / -1; }
@media (max-width: 560px) { .kgrid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="p-top">
  <div class="p-top-in">
    <a class="p-brand" href="portal.html" style="text-decoration:none;color:inherit">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect class="m-bg" width="64" height="64" rx="15"/><rect class="m-st" x="13" y="41" width="38" height="11" rx="5.5"/><rect class="m-st" x="18.5" y="29" width="27" height="10" rx="5"/><rect class="m-top" x="24" y="17.5" width="16" height="9.5" rx="4.75"/></svg>
      Varde <span>Portal</span>
    </a>
    <div style="margin-left:auto;display:flex;gap:10px;align-items:center"><a class="linkbtn p-app" href="index.html?app">Lærerappen</a><button class="themebtn" data-tema aria-label="Bytt til mørk modus" aria-pressed="false"><svg class="maane" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="p-user" id="pUser" hidden><small id="pUserName"></small><button class="linkbtn" id="logout">Logg ut</button></div></div>
  </div>
</header>
<main class="p-shell" id="main"><p class="lead" style="padding-top:40px">Laster …</p></main>

<script src="js/varde-core.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("main");
  var USER = null, UKER = 12, FANE = "oversikt";
  var FANER = [["oversikt", "Oversikt", "statistikk"], ["kontakter", "Skolens kontakter", "kontakter"], ["brukere", "Brukere og tilgang", "brukere"], ["logg", "Endringslogg", "brukere"]];
  function faner() { return USER.role === "eier" ? [] : FANER.filter(function (f) { return VardeCore.kan(USER.role, f[2]); }); }
  function topp(ekstra) {
    var erEier = USER.role === "eier", org = erEier ? USER.eier.name : USER.skole.name;
    var kick = erEier ? "Alle skoler" : "Skoleportal · " + VardeCore.ROLLER[USER.role].label;
    var f = faner();
    return "<div class='contours' aria-hidden='true'><svg viewBox='0 0 390 300'><ellipse cx='350' cy='120' rx='60' ry='38' transform='rotate(-18 350 120)'/><ellipse cx='350' cy='120' rx='110' ry='72' transform='rotate(-18 350 120)'/><ellipse cx='350' cy='120' rx='165' ry='108' transform='rotate(-18 350 120)'/><ellipse cx='350' cy='120' rx='225' ry='148' transform='rotate(-18 350 120)'/></svg></div><div class='p-head' style='position:relative'><div><p class='kicker'>" + esc(kick) + "</p><h1>" + esc(org) + "</h1></div>" + (ekstra || "") + "</div>" +
      (f.length > 1 ? "<nav class='tabs-p' aria-label='Portal'>" + f.map(function (x) { return "<button data-fane='" + x[0] + "' aria-current='" + (x[0] === FANE ? "page" : "false") + "'>" + x[1] + "</button>"; }).join("") + "</nav>" : "");
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tall(n) { return n === null ? "<" + VardeCore.MIN_ANTALL : n.toLocaleString("nb-NO"); }

  /* ---------- innlogging ---------- */
  function visLogin(melding) {
    document.getElementById("pUser").hidden = true;
    var h = "<section class='login'><div><p class='kicker'>Varde Portal</p><h1 style='font-size:2rem'>Logg inn</h1><p class='lead'>For skoleledere, kommuner og fylkeskommuner.</p></div>" +
      "<form class='panel' id='lf'><div class='field'><label for='le'>E-post</label><input id='le' type='email' autocomplete='username' required></div>" +
      "<div class='field'><label for='lp'>Passord</label><input id='lp' type='password' autocomplete='current-password' required></div>" +
      "<p class='err' id='lerr'" + (melding ? "" : " hidden") + ">" + esc(melding || "") + "</p><button class='btn' type='submit'>Logg inn</button></form>";
    if (VardeAPI.erDemo()) {
      h += "<p class='label' style='padding:0'>Demobrukere · passord: " + VardeCore.DEMO.passord + "</p><div class='list plain'>" +
        VardeCore.DEMO.brukere.filter(function (b) { return b.role !== "laerer"; }).map(function (b) {
          var rolle = b.role === "eier" ? (b.owner_id === "rogfk" ? "Rogaland fylkeskommune" : "Haugesund kommune") : VardeCore.ROLLER[b.role].label + ", Karmsund vgs";
          return "<button class='row choice' type='button' data-demo='" + b.email + "'><span class='row-txt'><b>" + rolle + "</b><small>" + b.email + "</small></span><svg class='ic chev' viewBox='0 0 24 24'><path d='M9 18l6-6-6-6'/></svg></button>";
        }).join("") + "</div>";
    }
    h += "</section>";
    main.innerHTML = h;
    document.getElementById("lf").addEventListener("submit", function (e) { e.preventDefault(); logg(document.getElementById("le").value, document.getElementById("lp").value); });
  }
  function logg(e, p) {
    VardeAPI.login(e, p).then(function (r) { start(r.bruker); }).catch(function (er) { var el = document.getElementById("lerr"); el.textContent = er.message; el.hidden = false; });
  }
  function start(b) {
    if (!VardeCore.kan(b.role, "statistikk")) { VardeAPI.logout(); visLogin("Du har ikke tilgang til portalen. Lærere bruker appen."); return; }
    USER = b;
    document.getElementById("pUser").hidden = false;
    document.getElementById("pUserName").textContent = b.name;
    last();
  }

  /* ---------- diagrammer ---------- */
  function hbars(liste, tom) {
    if (!liste || !liste.length) return "<p class='empty'>" + (tom || "Ingen data i perioden.") + "</p>";
    var maks = Math.max.apply(null, liste.map(function (x) { return x.n || 0; })) || 1;
    return "<div class='hbars'>" + liste.map(function (x) {
      var pst = x.n === null ? 0 : Math.max(2, Math.round(x.n / maks * 100));
      return "<div class='hbar" + (x.n === null ? " skjult" : "") + "' title='" + esc(x.label) + ": " + tall(x.n) + "'><span class='lbl'>" + esc(x.label) + "</span><span class='track'><span class='fill' style='display:block;width:" + pst + "%'></span></span><span class='val'>" + tall(x.n) + "</span></div>";
    }).join("") + "</div>";
  }

  function ukeTekst(w) { var m = w.match(/^(\d+)-W(\d+)$/); return "Uke " + Number(m[2]) + ", " + m[1]; }
  function ukeKort(w) { return String(Number(w.split("-W")[1])); }

  function weekChart(el, data) {
    var w = el.clientWidth || 600, h = 220, ml = 34, mb = 26, mt = 10, mr = 6;
    var maks = Math.max(5, Math.max.apply(null, data.map(function (d) { return d.n || 0; })));
    var steg = maks <= 10 ? 2 : maks <= 25 ? 5 : maks <= 60 ? 10 : maks <= 150 ? 25 : 50;
    var topp = Math.ceil(maks / steg) * steg;
    var iw = w - ml - mr, ih = h - mt - mb, bw = iw / data.length, gap = Math.min(4, bw * 0.25);
    var y = function (v) { return mt + ih - v / topp * ih; };
    var s = "<svg viewBox='0 0 " + w + " " + h + "' role='img' aria-label='Veiledninger per uke'><g class='grid'>";
    for (var v = 0; v <= topp; v += steg) s += "<line x1='" + ml + "' x2='" + (w - mr) + "' y1='" + y(v) + "' y2='" + y(v) + "'/>";
    s += "</g><g class='axis'>";
    for (v = 0; v <= topp; v += steg) s += "<text x='" + (ml - 8) + "' y='" + (y(v) + 4) + "' text-anchor='end'>" + v + "</text>";
    var hver = Math.ceil(data.length / Math.max(1, Math.floor(iw / 42)));
    data.forEach(function (d, i) { if (i % hver === 0 || i === data.length - 1) s += "<text x='" + (ml + i * bw + bw / 2) + "' y='" + (h - 6) + "' text-anchor='middle'>" + ukeKort(d.week) + "</text>"; });
    s += "</g><g>";
    data.forEach(function (d, i) {
      var x = ml + i * bw + gap / 2, bwi = Math.max(1, bw - gap);
      if (d.n === null) s += "<rect class='stub' x='" + x + "' y='" + (y(0) - 3) + "' width='" + bwi + "' height='3' rx='1.5'/>";
      else if (d.n > 0) { var top = y(d.n), hh = y(0) - top, r = Math.min(4, bwi / 2, hh); s += "<path class='bar-p barfill' d='M" + x + " " + y(0) + "V" + (top + r) + "Q" + x + " " + top + " " + (x + r) + " " + top + "H" + (x + bwi - r) + "Q" + (x + bwi) + " " + top + " " + (x + bwi) + " " + (top + r) + "V" + y(0) + "Z'/>"; }
      s += "<rect data-i='" + i + "' x='" + (ml + i * bw) + "' y='" + mt + "' width='" + bw + "' height='" + ih + "' fill='transparent'/>";
    });
    s += "</g></svg><div class='tip' hidden></div>";
    el.innerHTML = s;
    var tip = el.querySelector(".tip"), bars = el.querySelectorAll(".bar-p");
    el.querySelector("svg").addEventListener("mousemove", function (e) {
      var t = e.target.closest("[data-i]"); if (!t) { tip.hidden = true; return; }
      var d = data[+t.getAttribute("data-i")];
      tip.textContent = ukeTekst(d.week) + ": " + (d.n === null ? "under " + VardeCore.MIN_ANTALL : d.n) + " veiledninger";
      var rect = el.getBoundingClientRect(), sx = rect.width / w;
      tip.style.left = ((ml + (+t.getAttribute("data-i") + 0.5) * bw) * sx) + "px";
      tip.style.top = (y(d.n || 0) * sx) + "px";
      tip.hidden = false;
    });
    el.querySelector("svg").addEventListener("mouseleave", function () { tip.hidden = true; });
  }

  /* ---------- innsikt i klartekst ---------- */
  function innsikt(S) {
    var ut = [];
    var k = S.kategori.filter(function (x) { return x.n !== null; });
    if (k[0]) ut.push("Flest veiledninger gjelder <b>" + esc(k[0].label.toLowerCase()) + "</b> (" + tall(k[0].n) + " av " + tall(S.totalt.veiledninger) + ").");
    var st = S.stoff.filter(function (x) { return x.n !== null; });
    if (st[0]) ut.push("Når en elev er ruset på skolen, er det oftest <b>" + esc(st[0].label.toLowerCase()) + "</b>.");
    var r = S.rus.filter(function (x) { return x.n !== null; });
    if (r[0]) ut.push("Ansatte leser mest om <b>" + esc(r[0].label.toLowerCase()) + "</b>" + (r[1] ? " og <b>" + esc(r[1].label.toLowerCase()) + "</b>" : "") + ".");
    var f = S.funn.filter(function (x) { return x.n !== null; });
    if (f[0]) ut.push("Vanligste hendelse om funn og salg: <b>" + esc(f[0].label.toLowerCase()) + "</b>.");
    if (S.skoler) {
      var a = S.skoler.filter(function (x) { return x.akutt !== null && x.akutt > 0; }).sort(function (x, y) { return y.akutt - x.akutt; });
      if (a[0]) ut.push("Flest akutte situasjoner: <b>" + esc(a[0].name) + "</b> (" + tall(a[0].akutt) + ").");
    }
    var p = S.perUke.filter(function (x) { return x.n !== null; });
    if (p.length >= 8) {
      var half = Math.floor(p.length / 2), sum = function (a) { return a.reduce(function (s, x) { return s + x.n; }, 0) / a.length; };
      var for_ = sum(p.slice(0, half)), etter = sum(p.slice(half));
      if (for_ > 0) { var end = Math.round((etter - for_) / for_ * 100); if (Math.abs(end) >= 10) ut.push("Bruken har " + (end > 0 ? "<b>økt med " + end + " %</b>" : "<b>gått ned med " + Math.abs(end) + " %</b>") + " i siste halvdel av perioden."); }
    }
    return ut;
  }

  /* ---------- hovedvisning ---------- */
  function last() {
    if (FANE === "kontakter") return visKontakter();
    if (FANE === "brukere") return visBrukere();
    if (FANE === "logg") return visLogg();
    main.innerHTML = "<p class='lead' style='padding-top:40px'>Henter tall …</p>";
    VardeAPI.statistikk(UKER).then(vis).catch(function (e) { if (e.status === 401) visLogin(); else if (e.status === 403) visLogin(e.message); else main.innerHTML = "<p class='err' style='padding-top:40px'>" + esc(e.message) + "</p>"; });
  }

  function vis(S) {
    var h = topp("<div class='seg' role='group' aria-label='Periode'>" + [[4, "4 uker"], [12, "12 uker"], [52, "12 måneder"]].map(function (p) {
        return "<button data-uker='" + p[0] + "' aria-pressed='" + (p[0] === UKER) + "'>" + p[1] + "</button>"; }).join("") + "</div>");
    if (S.demo) h += "<div class='banner'><span><b>Eksempeldata.</b> Tallene er generert for å vise hvordan portalen fungerer. De sier ingenting om virkelig bruk på skolene.</span></div>";

    h += "<div class='kpis'>" +
      kpi("Veiledninger", S.totalt.veiledninger, "fullførte veivisere") +
      kpi("Alvorlige og akutte", S.totalt.alvorlig, "veiledninger med høy alvorlighet") +
      kpi("Aktive brukere", S.totalt.aktiveSnitt, "i snitt per uke") +
      kpi("Oppslag om rusmidler", S.totalt.rusoppslag, "sider om rusmidler, tobakk og snus") + "</div>";

    var ins = innsikt(S);
    h += "<div class='stack'><div class='panel insight'><h2>Største utfordringer i perioden</h2>" + (ins.length ? "<ol>" + ins.map(function (x) { return "<li><span>" + x + "</span></li>"; }).join("") + "</ol>" : "<p class='empty'>For lite data til å vise mønstre ennå.</p>") + "</div>";
    h += "<div class='panel'><h2>Veiledninger per uke</h2><p class='p-sub'>Alle veivisere samlet. Uker med under " + VardeCore.MIN_ANTALL + " vises som en grå strek.</p><div class='weekchart' id='wc'></div></div>";
    h += "<div class='grid2'><div class='panel'><h2>Hva veiledningene gjelder</h2>" + hbars(S.kategori) + "</div>" +
      "<div class='panel'><h2>Rusmidler når elever er ruset</h2><p class='p-sub'>Fra akutt-veiviseren</p>" + hbars(S.stoff) + "</div></div>";
    h += "<div class='grid2'><div class='panel'><h2>Mest leste om rusmidler</h2>" + hbars(S.rus) + "</div>" +
      "<div class='panel'><h2>Funn og salg</h2><p class='p-sub'>Fra veiviseren for funn og salg</p>" + hbars(S.funn) + "</div></div>";

    if (S.skoler) {
      h += "<div class='panel'><h2>Skolene</h2><p class='p-sub'>Tall under " + VardeCore.MIN_ANTALL + " vises ikke.</p><div class='tbl-wrap'><table><thead><tr><th>Skole</th><th class='num'>Veiledninger</th><th class='num'>Elev ruset nå</th><th>Vanligste situasjon</th><th>Vanligste rusmiddel</th></tr></thead><tbody>" +
        S.skoler.map(function (s) {
          return "<tr><td>" + esc(s.name) + "</td><td class='num'>" + tall(s.veiledninger) + "</td><td class='num'>" + tall(s.akutt) + "</td><td" + (s.vanligst ? "" : " class='muted'") + ">" + esc(s.vanligst || "–") + "</td><td" + (s.rusmiddel ? "" : " class='muted'") + ">" + esc(s.rusmiddel || "–") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
    h += "<div class='panel'><h2>Om tallene</h2><ul class='bullets'><li>Tallene viser hva ansatte har brukt Varde til, ikke hvor mange hendelser som har skjedd.</li>" +
      "<li>Ingen opplysninger om hvem som har brukt appen lagres sammen med bruken. Tid lagres bare som uke.</li>" +
      "<li>Tall under " + VardeCore.MIN_ANTALL + " vises aldri, så enkelthendelser ikke kan kjennes igjen.</li>" +
      "<li>Tallene skal ikke brukes til å vurdere enkeltansatte.</li></ul></div></div>";
    main.innerHTML = h;
    var wc = document.getElementById("wc");
    weekChart(wc, S.perUke);
    window.onresize = function () { weekChart(wc, S.perUke); };
  }
  function kpi(t, n, sub) { return "<div class='kpi'><span>" + t + "</span><b>" + tall(n) + "</b><small>" + sub + "</small></div>"; }

  /* ---------- skolens kontakter ---------- */
  function visKontakter(melding) {
    main.innerHTML = topp() + "<p class='lead'>Henter …</p>";
    VardeAPI.kontakter().then(function (r) {
      var finn = function (key) { return r.kontakter.filter(function (k) { return k.key === key; })[0] || {}; };
      var h = topp() + "<div class='stack' style='margin-top:0'>";
      if (melding) h += melding;
      h += "<form class='panel' id='kf'><h2>Skolens kontakter</h2><p class='p-sub'>Vises for alle ansatte på skolen under «Kontakter» i appen. Bruk jobbnummer, ikke private nummer.</p>";
      VardeCore.KONTAKTER.forEach(function (d) {
        var k = finn(d.key);
        h += "<fieldset class='kfs'><legend>" + esc(d.label) + "</legend><div class='kgrid'>" +
          "<div class='field'><label for='kn-" + d.key + "'>Navn eller funksjon</label><input id='kn-" + d.key + "' value='" + esc(k.name || "") + "' maxlength='100'></div>" +
          "<div class='field'><label for='kp-" + d.key + "'>Telefon</label><input id='kp-" + d.key + "' value='" + esc(k.phone || "") + "' maxlength='30' inputmode='tel'></div>" +
          "<div class='field kwide'><label for='km-" + d.key + "'>Merknad</label><input id='km-" + d.key + "' value='" + esc(k.note || "") + "' maxlength='200' placeholder='F.eks. åpningstider'></div></div></fieldset>";
      });
      h += "<p class='err' id='kerr' hidden></p><button class='btn' type='submit'>Lagre kontakter</button></form></div>";
      main.innerHTML = h;
      document.getElementById("kf").addEventListener("submit", function (e) {
        e.preventDefault();
        var liste = VardeCore.KONTAKTER.map(function (d) { return { key: d.key, name: document.getElementById("kn-" + d.key).value, phone: document.getElementById("kp-" + d.key).value, note: document.getElementById("km-" + d.key).value }; });
        VardeAPI.lagreKontakter(liste).then(function () { visKontakter("<div class='ok'>Kontaktene er lagret og vises nå i appen.</div>"); })
          .catch(function (er) { var x = document.getElementById("kerr"); x.textContent = er.message; x.hidden = false; });
      });
    }).catch(feilVis);
  }

  /* ---------- brukere og tilgang (skoleleder) ---------- */
  function rolleValg(id, valgt) {
    return "<select id='" + id + "' class='sel'>" + VardeCore.SKOLEROLLER.map(function (r) { return "<option value='" + r + "'" + (r === valgt ? " selected" : "") + ">" + esc(VardeCore.ROLLER[r].label) + "</option>"; }).join("") + "</select>";
  }
  function visBrukere(melding) {
    main.innerHTML = topp() + "<p class='lead'>Henter …</p>";
    VardeAPI.brukere().then(function (r) {
      var h = topp() + "<div class='stack' style='margin-top:0'>" + (melding || "");
      h += "<form class='panel' id='af'><h2>Legg til bruker</h2><p class='p-sub'>Brukeren får et midlertidig passord som vises én gang.</p><div class='addform'>" +
        "<div class='field'><label for='an'>Navn</label><input id='an' required autocomplete='off'></div><div class='field'><label for='ae'>E-post</label><input id='ae' type='email' required autocomplete='off'></div>" +
        "<div class='field'><label for='ar'>Rolle</label>" + rolleValg("ar", "laerer") + "</div><button class='btn' type='submit'>Legg til</button></div><p class='err' id='aerr' hidden></p></form>";
      h += "<div class='panel'><h2>Brukere på skolen</h2><p class='err' id='uerr' hidden></p><div>" + r.brukere.map(function (u) {
        var meg = u.email === USER.email;
        return "<div class='users-row" + (u.active ? "" : " off") + "'><span><b>" + esc(u.name) + (meg ? " (deg)" : "") + "</b><small>" + esc(u.email) + "</small></span>" +
          (meg ? "<span class='role'>" + esc(VardeCore.ROLLER[u.role].label) + "</span><span></span>"
               : rolleValg("r-" + u.id, u.role).replace("<select", "<select data-rolle='" + u.id + "'" + (u.active ? "" : " disabled")) +
                 "<button class='btn ghost' style='height:34px;padding:0 14px;font-size:.85rem' data-akt='" + u.id + "' data-on='" + (u.active ? 0 : 1) + "'>" + (u.active ? "Deaktiver" : "Aktiver") + "</button>") + "</div>";
      }).join("") + "</div></div>";
      h += "<div class='panel'><h2>Hva rollene får tilgang til</h2><div class='tbl-wrap'><table><thead><tr><th>Rolle</th><th>Appen</th><th>Statistikk</th><th>Skolens kontakter</th><th>Brukere og tilgang</th></tr></thead><tbody>" +
        VardeCore.SKOLEROLLER.map(function (rl) { var j = function (t) { return VardeCore.kan(rl, t) ? "Ja" : "–"; }; return "<tr><td>" + esc(VardeCore.ROLLER[rl].label) + "</td><td>Ja</td><td>" + j("statistikk") + "</td><td>" + j("kontakter") + "</td><td>" + j("brukere") + "</td></tr>"; }).join("") +
        "</tbody></table></div><ul class='bullets'><li>Du kan ikke endre din egen rolle eller deaktivere deg selv.</li><li>Skolen må alltid ha minst én aktiv skoleleder.</li><li>Når en rolle endres eller en bruker deaktiveres, logges vedkommende ut med en gang.</li><li>Alle endringer lagres i endringsloggen.</li></ul></div></div>";
      main.innerHTML = h;
      document.getElementById("af").addEventListener("submit", function (e) {
        e.preventDefault();
        var n = document.getElementById("an").value, m = document.getElementById("ae").value, ro = document.getElementById("ar").value;
        VardeAPI.nyBruker(n, m, ro).then(function (res) {
          visBrukere("<div class='ok'>Bruker opprettet for " + esc(m) + " (" + esc(VardeCore.ROLLER[ro].label) + "). Midlertidig passord: <code>" + esc(res.midlertidigPassord) + "</code><br>Gi passordet til brukeren på en trygg måte. Det vises bare nå.</div>");
        }).catch(function (er) { var x = document.getElementById("aerr"); x.textContent = er.message; x.hidden = false; });
      });
    }).catch(feilVis);
  }
  function brukerFeil(er) { var x = document.getElementById("uerr"); if (x) { x.textContent = er.message; x.hidden = false; } }

  function visLogg() {
    main.innerHTML = topp() + "<p class='lead'>Henter …</p>";
    VardeAPI.endringslogg().then(function (r) {
      main.innerHTML = topp() + "<div class='panel'><h2>Endringslogg</h2><p class='p-sub'>Hvem som har endret brukere, roller og kontakter. Bruken av appen logges ikke her.</p>" +
        (r.logg.length ? "<div class='tbl-wrap'><table><thead><tr><th>Tid</th><th>Utført av</th><th>Endring</th><th>Detaljer</th></tr></thead><tbody>" +
          r.logg.map(function (l) { return "<tr><td>" + esc(l.tid) + "</td><td>" + esc(l.utfort_av) + "</td><td>" + esc(l.handling) + "</td><td>" + esc(l.detalj) + "</td></tr>"; }).join("") + "</tbody></table></div>"
          : "<p class='empty'>Ingen endringer ennå.</p>") + "</div>";
    }).catch(feilVis);
  }
  function feilVis(e) { if (e.status === 401) visLogin(); else main.innerHTML = topp() + "<p class='err'>" + esc(e.message) + "</p>"; }

  document.addEventListener("click", function (e) {
    var d = e.target.closest("[data-demo]"); if (d) { logg(d.getAttribute("data-demo"), VardeCore.DEMO.passord); return; }
    var u = e.target.closest("[data-uker]"); if (u) { UKER = +u.getAttribute("data-uker"); last(); return; }
    var f = e.target.closest("[data-fane]"); if (f) { FANE = f.getAttribute("data-fane"); last(); return; }
    var a = e.target.closest("[data-akt]"); if (a) { VardeAPI.settAktiv(+a.getAttribute("data-akt"), a.getAttribute("data-on") === "1").then(function () { visBrukere(); }).catch(brukerFeil); }
  });
  document.addEventListener("change", function (e) {
    var s = e.target.closest("[data-rolle]"); if (!s) return;
    VardeAPI.settRolle(+s.getAttribute("data-rolle"), s.value).then(function () { visBrukere("<div class='ok'>Rollen er endret.</div>"); }).catch(function (er) { visBrukere(); setTimeout(function () { brukerFeil(er); }, 50); });
  });
  document.getElementById("logout").addEventListener("click", function () { VardeAPI.logout().then(function () { USER = null; FANE = "oversikt"; visLogin(); }); });

  VardeAPI.me().then(function (r) { start(r.bruker); }).catch(function () { visLogin(); });
})();
</script>
</body>
</html>
