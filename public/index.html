      }).join("") : "<div class='tel'><div><span class='tel-lbl'>Skolen har ikke lagt inn kontakter ennå.</span></div></div>") +
        "<div class='tel'><div><small style='grid-column:auto'>" + (r.kanEndre ? "Du kan endre kontaktene i <a href='portal.html'>portalen</a>." : "Kontaktene styres av skolens ledelse.") + "</small></div></div>";
    }).catch(function () { var el = document.getElementById("skoleKontakter"); if (el) el.innerHTML = "<div class='tel'><div><span class='tel-lbl'>Kunne ikke hente skolens kontakter.</span></div></div>"; });
  }

  function nowLocal() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + " kl. " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  var NOTE_FIELDS = [
    ["tid", "Dato og tid", "input", "", ""],
    ["sted", "Sted", "input", "F.eks. klasserom 2B, skolegården", ""],
    ["elev", "Elev", "input", "Navn og klasse", "Brukes for å legge notatet i riktig elevmappe i arkivet."],
    ["obs", "Hva så og hørte du?", "textarea", "Bare fakta. F.eks. «Kom 20 min for sent, luktet hasj, røde øyne, svarte langsomt.»", "Skill mellom det du observerte og det du tror."],
    ["sitat", "Hva sa eleven?", "textarea", "Elevens egne ord i anførselstegn", ""],
    ["tilstede", "Hvem var til stede?", "input", "Ansatte og eventuelt elever", ""],
    ["tiltak", "Hva ble gjort?", "textarea", "F.eks. tatt ut av klassen, helsesykepleier tilkalt, foresatte ringt kl. 10.15", ""],
    ["varslet", "Hvem er varslet?", "input", "Rektor, foresatte, barnevern, politi …", ""],
    ["videre", "Videre oppfølging", "textarea", "Hvem gjør hva, og når", ""],
    ["skrevet", "Skrevet av", "input", "Navn og rolle", ""]
  ];

  function renderNotat() {
    spor({ type: "verktoy", kategori: "notat" });
    setWhere("Notat", "Verktøy");
    var skole = USER && USER.skole ? USER.skole.name : "skolen";
    var h = "<section class='screen' data-sec='Verktøy'>" + head("Verktøy", "Notat", "Skriv ned det som skjedde mens det er ferskt, og send det rett til skolens arkiv.", "doc");
    h += "<div class='callout green'><h3>Lagres ikke på telefonen</h3><div>Notatet sendes direkte til arkivet for " + esc(skole) + ". Det lagres verken på denne enheten eller i Varde, og forsvinner fra skjermen når det er sendt.</div></div>";
    h += "<form class='panel' id='noteForm' autocomplete='off'>";
    NOTE_FIELDS.forEach(function (f) {
      var id = "n-" + f[0], val = f[0] === "tid" ? nowLocal() : f[0] === "skrevet" && USER ? USER.name : "";
      h += "<div class='field'><label for='" + id + "'>" + f[1] + (f[0] === "elev" ? " <span style='color:var(--red)'>*</span>" : "") + "</label>" +
        (f[2] === "textarea" ? "<textarea id='" + id + "' placeholder='" + esc(f[3]) + "' maxlength='5000'></textarea>" : "<input id='" + id + "' value='" + esc(val) + "' placeholder='" + esc(f[3]) + "' maxlength='5000'>") +
        (f[4] ? "<span class='hint'>" + f[4] + "</span>" : "") + "</div>";
    });
    h += "<p class='err' id='noteErr' hidden></p>";
    h += "<div id='noteActions' class='btnrow'><button class='btn' type='submit'>Send til skolens arkiv</button><button class='btn ghost' type='button' id='copyNote'>Kopier i stedet</button><button class='btn ghost' type='button' id='clearNote'>Tøm</button></div>";
    h += "<div id='noteConfirm' class='callout amber' hidden><h3>Send notatet?</h3><div>Notatet sendes til arkivet for " + esc(skole) + ". Du kan ikke endre det i Varde etterpå. Rettelser gjøres i arkivet.</div>" +
      "<div class='btnrow' style='margin-top:8px'><button class='btn' type='button' id='sendNow'>Send nå</button><button class='btn ghost' type='button' id='cancelSend'>Avbryt</button></div></div>";
    h += "</form></section>";
    app.innerHTML = h;
    var form = document.getElementById("noteForm");
    function felter() { var o = {}; NOTE_FIELDS.forEach(function (f) { o[f[0]] = document.getElementById("n-" + f[0]).value; }); return o; }
    function visFeil(m) { var e = document.getElementById("noteErr"); e.textContent = m; e.hidden = !m; }
    function bekreft(vis) { document.getElementById("noteConfirm").hidden = !vis; document.getElementById("noteActions").hidden = vis; }
    if (NOTE_PREFILL) { document.getElementById("n-obs").value = NOTE_PREFILL.obs; document.getElementById("n-videre").value = NOTE_PREFILL.videre; NOTE_PREFILL = null; }
    form.addEventListener("submit", function (e) {
      e.preventDefault(); visFeil("");
      if (!VardeCore.validerNotat(felter())) { visFeil("Fyll inn elev og minst ett felt om hva som skjedde."); document.getElementById("n-elev").focus(); return; }
      bekreft(true);
    });
    document.getElementById("cancelSend").addEventListener("click", function () { bekreft(false); });
    document.getElementById("sendNow").addEventListener("click", function () {
      var knapp = this; knapp.disabled = true; knapp.textContent = "Sender …";
      VardeAPI.sendArkiv(felter()).then(function (k) {
        form.reset();
        app.innerHTML = "<section class='screen' data-sec='Verktøy'>" + head("Verktøy", "Sendt til arkivet", "", "doc") +
          "<div class='panel'><div class='tel' style='padding:0'><div><span class='tel-lbl'>Referanse i arkivet</span><span class='tel-n'>" + esc(k.referanse) + "</span><small>" + esc(k.arkiv) + "</small></div></div>" +
          "<ul class='bullets'><li>Notatet er ikke lagret på denne enheten eller i Varde.</li><li>Noter gjerne referansen hvis du skal følge opp saken.</li>" + (k.demo ? "<li>Dette er en demo. Ingen arkivkobling er satt opp, og notatet ble forkastet.</li>" : "") + "</ul></div>" +
          "<div class='q-block'><button class='cta' data-go='notat'><span>Skriv nytt notat</span>" + ico("arrow") + "</button><div class='list plain'><button class='row choice' data-go='hjem'><span class='row-txt'><b>Til forsiden</b></span>" + ico("chev", "chev") + "</button></div></div></section>";
      }).catch(function (er) {
        knapp.disabled = false; knapp.textContent = "Send nå"; bekreft(false);
        visFeil(er.message + (er.status === 503 ? "" : " Notatet er ikke sendt. Du kan prøve igjen eller kopiere det."));
      });
    });
    document.getElementById("copyNote").addEventListener("click", function () {
      var t = VardeCore.notatTekst(Object.keys(felter()).reduce(function (o, k) { o[k] = felter()[k].trim(); return o; }, {}), skole);
      copy(t, null); toast("Kopiert. Lim inn i skolens arkiv, ikke i e-post eller chat.");
    });
    document.getElementById("clearNote").addEventListener("click", function () {
      form.reset(); document.getElementById("n-tid").value = nowLocal(); if (USER) document.getElementById("n-skrevet").value = USER.name; bekreft(false); visFeil(""); toast("Skjemaet er tømt");
    });
  }

  function renderKilder() {
    setWhere("Kilder", "Verktøy");
    var S = [
      ["Helsedirektoratet", "Rusforebygging blant barn og unge, støtte til skolen og veilederen «Tidlig inn».", "https://www.helsedirektoratet.no/forebygging-diagnose-og-behandling/forebygging-og-levevaner/alkohol-og-rusmidler/rusmidler-og-rusmiddelbruk-stotte-til-undervisning-i-skolen/samarbeid-om-rusmiddelforebyggende-arbeid-blant-barn-og-unge"],
      ["Helsenorge", "Informasjon om rus, skolehelsetjenesten og hvor man får hjelp.", "https://www.helsenorge.no"],
      ["Politiet", "Politikontakt, bekymringssamtale, SLT og tips om narkotika.", "https://www.politiet.no"],
      ["Bufdir", "Opplysningsplikt til barnevernet og råd om å snakke med unge om rus.", "https://www.bufdir.no"],
      ["Utdanningsdirektoratet", "Skolens plikter: opplysningsplikt, skolemiljø og ordensreglement.", "https://www.udir.no"],
      ["Statsforvalteren", "Oppmerksomhetsplikt og meldeplikt til barneverntjenesten.", "https://www.statsforvalteren.no/rogaland/barnehage-og-opplaring/grunnskule-og-vidaregaande-opplaring/skolens-meldeplikt-til-barnevernet/"],
      ["RUSinfo", "Nasjonal, anonym informasjonstjeneste om rusmidler.", "https://www.rusinfo.no"],
      ["Norsk resuscitasjonsråd", "Førstehjelp: stabilt sideleie og hjerte-lunge-redning.", "https://nrr.org"],
      ["Lovdata", "Barnevernsloven, opplæringslova, straffeloven og forvaltningsloven.", "https://lovdata.no"]
    ];
    var h = "<section class='screen' data-sec='Verktøy'>" + head("Verktøy", "Kilder", "Rådene i appen er satt sammen fra disse kildene.", "book");
    h += "<div class='list'>" + S.map(function (s) {
      return "<a class='src' href='" + s[2] + "' target='_blank' rel='noopener'><b>" + s[0] + "</b><span>" + s[1] + "</span><em>" + s[2].replace(/^https:\/\/(www\.)?/, "").split("/")[0] + "</em></a>";
    }).join("") + "</div>";
    h += "<div class='callout amber'><h3>Tilpass til din skole</h3><div>Skolens beredskapsplan, rutiner for melding til barnevernet og avtaler med politiet (SLT) går foran de generelle rådene her.</div></div>";
    h += "<p class='label'>Om appen</p><div class='panel about'>" + MARK + "<div><h3>Varde</h3><p class='lead' style='font-size:.92rem'>En varde er steiner stablet for å vise vei i terrenget. Appen viser vei når du står i en vanskelig situasjon med en elev.</p></div></div>";
    h += "<p class='foot'>Sist gjennomgått oktober 2026.</p></section>";
    app.innerHTML = h;
  }

  /* ---------- Navigasjon ---------- */
  function route() {
    var id = (location.hash || "").replace("#", "") || "hjem";
    if (!USER) {
      if (id === "personvern") { renderFlow(id, INFO[id]); backBtn.hidden = false; return; }
      renderLogin(); return;
    }
    if (id === "hjem") renderHome();
    else if (id === "kontakter") renderKontakter();
    else if (id === "notat") renderNotat();
    else if (id === "kilder") renderKilder();
    else if (/^[a-z]+(-(\d+|resultat))?$/.test(id) && WIZ[id.split("-")[0]]) routeWizard(id.split("-")[0], id.split("-")[1]);
    else if (INFO[id]) renderFlow(id, INFO[id]);
    else { renderHome(); id = "hjem"; }
    backBtn.hidden = id === "hjem";
    document.body.classList.toggle("sub", id !== "hjem");
    document.body.classList.toggle("akuttflow", /^akutt(-|$)/.test(id));
    document.querySelectorAll(".tab").forEach(function (t) {
      if (t.getAttribute("data-go") === id) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
  }
  var depth = 0;
  function go(id) {
    if (("#" + id) === location.hash || (id === "hjem" && !location.hash)) { route(); return; }
    depth++;
    location.hash = id;
  }
  window.addEventListener("hashchange", route);
  backBtn.addEventListener("click", function () {
    if (depth > 0) { depth--; history.back(); } else { location.hash = "hjem"; }
  });

  var topEl = document.getElementById("top");
  window.addEventListener("scroll", function () { topEl.classList.toggle("scrolled", window.scrollY > 4); }, { passive: true });

  document.addEventListener("click", function (e) {
    var g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
    if (e.target.closest("[data-logout]")) { loggUt(); return; }
    var dm = e.target.closest("[data-demo]");
    if (dm) { loggInn(dm.getAttribute("data-demo"), VardeCore.DEMO.passord); return; }
    var an = e.target.closest("[data-ans]");
    if (an) { answer(an.getAttribute("data-ans")); return; }
    var mu = e.target.closest("[data-multi]");
    if (mu) { toggleMulti(mu); return; }
    if (e.target.closest("[data-next]")) { multiNext(); return; }
    var rs = e.target.closest("[data-restart]");
    if (rs) { var rw = rs.getAttribute("data-restart"); ANS[rw] = {}; go(rw); return; }
    var nt = e.target.closest("[data-note]");
    if (nt) { makeNote(nt.getAttribute("data-note")); return; }
    var c = e.target.closest("[data-copy]");
    if (c) { copy(c.getAttribute("data-copy"), null); return; }
    var li = e.target.closest(".checklist li");
    if (li) toggle(li);
  });
  document.addEventListener("keydown", function (e) {
    var li = e.target.closest && e.target.closest(".checklist li");
    if (li && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggle(li); }
  });
  function toggle(li) {
    var on = li.classList.toggle("done");
    li.setAttribute("aria-checked", on ? "true" : "false");
    updateProg(li.closest("[data-check]"));
  }


  function copy(text, fallbackEl) {
    function selectFallback() {
      if (fallbackEl) {
        var r = document.createRange(); r.selectNodeContents(fallbackEl);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        toast("Teksten er markert. Kopier den manuelt.");
      } else toast("Kunne ikke kopiere. Skriv av nummeret.");
    }
    try { navigator.clipboard.writeText(text).then(function () { toast("Kopiert"); }, selectFallback); }
    catch (e) { selectFallback(); }
  }
  var tt;
  function toast(msg) {
    var el = document.querySelector(".toast");
    if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2200);
  }

  app.innerHTML = "<section class='screen login'><p class='lead' style='padding-top:40px'>Laster …</p></section>";
  VardeAPI.me().then(function (r) { ferdigInnlogget(r.bruker); }).catch(function () { renderLogin(); });
})();
</script>
